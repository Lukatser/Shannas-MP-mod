 aet_ideas.8.b_tt:0 "Number of provinces that can still be developed: [This.aet_ideas_8_dipPossible]"
 aet_ideas.8.c_tt:0 "Number of provinces that can still be developed: [This.aet_ideas_8_milPossible]"

 aet_ideas.8.t:0 "Colonial Development"
 aet_ideas.8.d:0 "Our colonial subjects possess considerable room for further development. We must decide which aspect of their territories should receive our attention and resources."

 aet_ideas.8.a:0 "Administrative Development"
 aet_ideas.8.b:0 "Diplomatic Development"
 aet_ideas.8.c:0 "Military Development"

 aet_ideas.9.t:0 "Administrative Development"
 aet_ideas.9.desc:0 "We can direct administrative resources towards developing our colonial territories. The scope of the programme will determine both its cost and the number of provinces that can be developed."

 aet_ideas.9.a:0 "Develop 3 Provinces"
 aet_ideas.9.b:0 "Develop 10 Provinces"
 aet_ideas.9.c:0 "Develop 20 Provinces"
 aet_ideas.9.d:0 "Cancel Investment"

 aet_ideas.12.t:0 "Diplomatic Development"
 aet_ideas.12.d:0 "We can direct diplomatic resources towards developing our colonial territories. The scope of the programme will determine both its cost and the number of provinces that can be developed."

 aet_ideas.14.t:0 "Military Development"
 aet_ideas.14.d:0 "We can direct military resources towards developing our colonial territories and strengthening their fortifications. The scope of the programme will determine both its cost and the number of provinces that can be developed."

 aet_ideas.16.t:0 "Colonial Construction"
 aet_ideas.16.d:0 "Our colonial territories offer opportunities for further economic development. We can direct our resources towards establishing workshops, counting houses, or manufactories where suitable."

 aet_ideas.16.a:0 "Construct Workshops"
 aet_ideas.16.b:0 "Construct Counting Houses"
 aet_ideas.16.c:0 "Construct Manufactories"
 aet_ideas.16.e:0 "Cancel Investment"

 aet_ideas.17.t:0 "Colonial Construction Programme"
 aet_ideas.17.d:0 "The available provinces have been assessed for the selected type of construction. We must now determine the scale of our programme. The estimated cost per province is based on the average construction cost of the available sites."

 aet_ideas.17.a:0 "Construct in 3 Provinces"
 aet_ideas.17.b:0 "Construct in 10 Provinces"
 aet_ideas.17.c:0 "Construct in 20 Provinces"

 aet_ideas.11.t:0 "The Overlord's Patronage"
 aet_ideas.11.d:0 "The Overlord has approved our proposed investment in the development of the colony. With its support secured, the necessary resources have been granted and the designated provinces shall now be developed for the benefit of our colonial realm."
 aet_ideas.11.a:0 "Very Well"

 aet_ideas.19.t:0 "The Overlord's Investment"
 aet_ideas.19.d:0 "The Overlord has approved our proposed construction programme and granted its support for the undertaking. The designated projects may now proceed, bringing new workshops, counting houses, and manufactories to our colonial territories."
 aet_ideas.19.a:0 "Very Well"

