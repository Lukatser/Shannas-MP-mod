l_english:
 administrative_ideas:0 "Administrative Ideas"
 administrative_ideas_bonus:0 "Fully Administrative"
 administrative_council:0 "Administrative Council"
 administrative_council_desc:0 "Establish a council dedicated to the matters of administration, in order to refine and improve our bureaucratic capabilities."
 local_rule:0 "Local Provisioning"
 local_rule_desc:0 "Armies and fleets need not depend entirely upon the central treasury for their everyday needs. By organising supplies, maintenance and administration at the local level, we can reduce the expense of maintaining our military forces."
 adaptability:0 "Adaptable Administration"
 adaptability_desc:0 "No two newly acquired territories are alike. By adapting our administrative practices to local circumstances rather than imposing a single rigid system, we can incorporate new lands into the state far more efficiently."
 cultural_regulations:0 "Standardised Procurement"
 cultural_regulations_desc:0 "Central standards for equipment, contracts and procurement allow the state to purchase the materials required by its armies and fleets in far greater quantities and at considerably lower cost."
 stable_government:0 "Stable Government"
 stable_government_desc:0 "A steady hand on the helm of our government serves only to assure the many elements within our ranks that the country is faring well and prospers."
 centralization:0 "Centralisation"
 centralization_desc:0 "Authority is most effective when the decisions of the centre can be carried out throughout the realm. Strengthening the institutions of central government allows us to reduce local autonomy and exercise greater control even over distant territories."
 civil_servants:0 "Civil Service"
 civil_servants_desc:0 "By establishing a Civil Service of eager young bureaucrats will ensure that we are able to quickly adapt to new advances in administration and governance."

 economic_ideas:0 "Industrial Ideas"
 economic_ideas_bonus:0 "Full Industrial Focus"
 bureaucracy:0 "Industrial Zoning"
 bureaucracy_desc:0 "As towns grow into centres of production, careful planning is needed to make room for workshops, warehouses and industry. By setting aside land for further development, our provinces can support a greater number of buildings."
 national_bank:0 "Efficient Production"
 national_bank_desc:0 "Improved organisation of labour, access to capital and more efficient methods of production will allow our industries to produce more with the same resources."
 merchant_passes:0 "Standardised Construction"
 merchant_passes_desc:0 "Standardised designs, organised supply chains and experienced builders can greatly reduce the expense of expanding our industrial base."
 efficient_mining:0 "Industrial Investment"
 efficient_mining_desc:1 "Large-scale construction requires coordination between the state and private capital. By creating dedicated investment programmes, we can rapidly accelerate industrial expansion.\n\nUnlocks the §YIndustrial Investment§! decision, allowing us to invest in temporarily accelerating construction."
 debt_and_loans:0 "Commercial Networks"
 debt_and_loans_desc:0 "Industry cannot prosper in isolation. Better connections between producers, merchants and markets will allow the goods of our provinces to command a greater share of local trade."
 nationalistic_enthusiasm:0 "Integrated Markets"
 nationalistic_enthusiasm_desc:0 "By removing barriers between producers and consumers and improving the flow of goods throughout our economy, a greater share of the wealth created by trade can be captured by our merchants."
 smithian_economics:0 "Smithian Economics"
 smithian_economics_desc:1 "Investment in manufacturing does more than increase immediate output. New manufactories attract workers, encourage urban growth and stimulate the surrounding economy.\n\n§YConstructing Manufactories directly increases the Development of their province§!"
 aet_ideas_industrialinvestment_title:0 "Launch an Industrial Investment Program"
 aet_ideas_industrialinvestment_desc:0 "The expansion of industry cannot always be left to private initiative alone. By coordinating investment, directing capital toward productive enterprises and supporting large construction projects, the state can trigger a concentrated period of industrial expansion.\n\nFor §Y5 years§!, we will gain reduced construction costs and construction time, as well as increased production efficiency. This decision may only be taken once every §Y20 years§!."
 aet_ideas_industrial_investment:0 "Industrial Investment Program"
 aet_ideas_industrial_investment_desc:0 "Public and private capital is being directed toward workshops, factories, infrastructure and other productive enterprises. The resulting surge in construction has lowered building costs, accelerated new projects and increased the efficiency of our industrial economy."

 expansion_ideas:0 "Expansion Ideas"
 expansion_ideas_bonus:0 "Fully Expansionist"
 additional_colonists:0 "Additional Colonists"
 additional_colonists_desc:0 "The new world is many things, most important of all, empty. Well no one important lives there at any rate. By letting people know of the boundless opportunities we have in the new world we will encourage more people to go forth and settle there."
 additional_diplomats:0 "Additional Diplomats"
 additional_diplomats_desc:0 "The drive to expand our country means we must also expand our diplomatic reach. We must ensure that our diplomatic service is properly staffed."
 faster_colonists:0 "Faster Colonists"
 faster_colonists_desc:0 "You cannot simply send colonists out and expect them to build a colony. There is a time-consuming process of preparing the expedition with all the items they will need to survive in their new home. Using past experience, we can speed this process up."
 vice_roys:0 "Viceroys"
 vice_roys_desc:0 "Makes it possible for us to establish Viceroys and thereby improve the administration of our Colonies and increase the amount of money they generate."
 general_colonization_law:0 "General Colonization Law"
 general_colonization_law_desc:0 "By adopting a law allowing free movement of foreign people to our colonies we'll be sure to lure a wider range of future settlers."
 additional_merchants:0 "Colonial Administration"
 additional_merchants_desc:0 "Settlements and distant territories can place a considerable burden upon the treasury if poorly administered. A specialised colonial administration reduces the cost of maintaining our colonies while allowing the state to exercise greater authority over territories beyond our established states."
 competetive_merchants:0 "Competitive Merchants"
 competetive_merchants_desc:0 "To bring trade home we must be able to beat the competition from other countries. We need to ensure that our legal system gives them every possible edge."

 humanist_ideas:0 "Humanist Ideas"
 humanist_ideas_bonus:0 "Humanist Administration"
 local_traditions:0 "Local Traditions"
 local_traditions_desc:0 "People are far less likely to resist a government that respects the customs and traditions that shape their daily lives. By allowing local practices to coexist with our own, we can reduce unrest and more easily bring different religious traditions into harmony."
 indirect_rule:0 "Indirect Rule"
 indirect_rule_desc:0 "Newly incorporated peoples need not immediately abandon their traditional institutions. By governing through existing local structures where possible, we can ease the transition into our realm and reduce the resentment caused by conquest."
 ecumenism:0 "Ecumenism"
 ecumenism_desc:0 "Religious differences need not prevent people from serving the same state. By judging our subjects according to their loyalty and ability rather than their faith, we can draw upon the talents of the entire population without suffering the usual penalties of religious division."
 cultural_ties:0 "Cultural Integration"
 cultural_ties_desc:0 "Languages and customs may differ, but cooperation between communities can bind them together. By recognising additional cultures and lowering the barriers to their acceptance, we can integrate a wider variety of peoples into the state."
 humanist_tolerance:0 "Inclusive Service"
 humanist_tolerance_desc:0 "Subjects who feel that their culture is recognised as a legitimate part of the realm are more willing to defend it. By fully integrating accepted peoples into our institutions, we can draw more soldiers from their communities."
 benevolence:0 "Benevolent Reputation"
 benevolence_desc:0 "A state known for tolerance and fair treatment finds it easier to maintain good relations abroad. Merchants and diplomats alike benefit from the trust created by a reputation for moderation and cooperation."
 tolerance_idea:0 "Court of Acceptance"
 tolerance_idea_desc:0 "Tolerance must extend beyond provincial administration and into the highest institutions of the state. By welcoming a broader range of voices into political life, we can build greater support for parliamentary proposals and encourage a wider range of issues to be debated.\n\n§YUnlocks the Tier 2 Government Reform 'Court of Acceptance'.§!"

 infrastructure_ideas:0 "Infrastructure Ideas"
 infrastructure_ideas_bonus:0 "Full Infrastructure"
 state_efficiency:0 "Regional Administration"
 state_efficiency_desc:1 "Efficient local administration and well-maintained public services reduce the cost of governing our states while creating the conditions necessary for lasting prosperity."
 organised_construction:0 "Urban Planning"
 organised_construction_desc:0 "Growth need not be chaotic. By coordinating the expansion of towns and cities, laying out new districts and planning ahead for future needs, our provinces can be developed far more efficiently."
 expanded_infrastructure_network:0 "Integrated Transport Networks"
 expanded_infrastructure_network_desc:0 "Roads, canals, bridges and commercial routes connect the centres of our realm. Better infrastructure allows people, armies and goods to move more efficiently while strengthening our centres of trade."
 administrative_efficiency_idea:0 "Provincial Administration"
 administrative_efficiency_idea_desc:0 "As our provinces become richer and more complex, they require increasingly capable local institutions. A more efficient administrative network allows densely developed states to be governed without placing excessive strain on the central government."
 fort_logistics:0 "Centralised State Planning"
 fort_logistics_desc:0 "Regional development is most effective when individual provinces are planned as part of a greater whole. Coordinating administration, transport and public investment across an entire state makes further centralisation significantly easier."
 regulation_bureau:0 "Bureau of Public Works"
 regulation_bureau_desc:0 "Monuments and great public projects require enormous amounts of labour, expertise and material. A permanent bureau dedicated to overseeing these undertakings can reduce both their cost and the time required to complete them."
 efficient_construction_plans:0 "Expanded Infrastructure"
 efficient_construction_plans_desc:0 "As our cities grow, existing infrastructure must grow alongside them. Better planning and established construction networks allow us to expand provincial infrastructure at significantly reduced cost."

 innovativeness_ideas:0 "Innovative Ideas"
 innovativeness_ideas_bonus:0 "Full Innovativeness"
 patron_of_art:0 "Patron of the Arts"
 patron_of_art_desc:0 "Artists, philosophers and scholars flourish when given the freedom and resources to pursue new ideas. By encouraging intellectual exchange beyond the ordinary business of government, we open new possibilities for combining the policies and institutions of our state."
 empiricism:0 "Empiricism"
 empiricism_desc:0 "With the search of knowledge also comes many false ideas. It is only with evidence and our experience of the world around us that we can prove or disprove that what is before us is in fact true."
 scientific_revolution:0 "Scientific Revolution"
 scientific_revolution_desc:0 "We should strive towards a social and economic revolution marked by technological inventions and a transfer from an agricultural society into an industrial one."
 dynamic_court:0 "Dynamic Court"
 dynamic_court_desc:0 "A truly innovative court is one where any person may rise to shine. We must strive to make sure that old traditions, birth or wealth aren't a hindrance to the development of our court or a barrier to talented people wishing to seek their fortune in the service of our state."
 print_culture:0 "Print Culture"
 print_culture_desc:0 "It is by exchange of ideas that we advance as a society. The words of our generations greatest minds must be written down and shared with their peers."
 optimism:0 "Optimism"
 optimism_desc:0 "A society confident in its own progress is better able to endure temporary setbacks. Faith in a brighter future reduces the exhaustion caused by prolonged conflict while the achievements of our age add to the splendour of the state."
 expanded_policies:0 "Expanded Policies"
 expanded_policies_desc:0 "Policies are essential for the direction and the future of our country. We should invest and expand into the legal code of our realm so we can maintain policies easier."

 religious_ideas:0 "Religious Ideas"
 religious_ideas_bonus:0 "Fully Religious"
 missionary_schools_1:0 "Missionary Schools"
 missionary_schools_1_desc:0 "Although there is no shortage of people ready to go out and spread the true faith, most of these people simply do more harm than good. However, specialist schools to train the missionaries will ensure we have more people who cannot only spread the faith, but succeed as well."
 church_attendance_duty_1:0 "Church Attendance Duty"
 church_attendance_duty_1_desc:0 "By adopting a mandatory church attendance policy, the emphasis on religious values and beliefs will unquestionably minimize the costs of maintaining law and order."
 divine_supremacy_1:0 "Divine Supremacy"
 divine_supremacy_1_desc:0 "It is of the utmost importance that we rid our nation and its surrounding borders from the infidels pestering our lands."
 devoutness_1:0 "Devoutness"
 devoutness_1_desc:0 "Religion is one of the most important bulwarks of our rulership. By public displays of piety by the rulers, the ruled will follow suit. The growing of piety amongst our people will strengthen our rule."
 inquisition_1:0 "Inquisition"
 inquisition_1_desc:0 "Establish a state-sanctioned Inquisition to maintain the religious purity of our populace by rooting out heretics and blasphemers."
 religious_tradition_1:0 "Religious Tradition"
 religious_tradition_1_desc:0 "The strength of our faith and public displays of piety and worship are admired by other lands both near and far. This is reflected in the prestige and glory to our realm."
 deus_vult_1:0 "Deus Vult"
 deus_vult_1_desc:0 "Join the battle cry of the crusades, 'God wills it' and crush the infidels."

 christian_ideas:0 "Christian Ideas"
 christian_ideas_bonus:0 "Fully Christian"
 study_of_scripture:0 "Study of Scripture"
 study_of_scripture_desc:0 "A deeper understanding of scripture strengthens both personal devotion and the institutions of the Church. By encouraging theological study throughout the realm, we can reinforce the religious authority upon which our faith depends."
 inquisition:0 "Inquisition"
 inquisition_desc:0 "Establish a state-sanctioned Inquisition to maintain the religious purity of our populace by rooting out heretics and blasphemers."
 devoutness:0 "Devoutness"
 devoutness_desc:0 "Religion is one of the most important bulwarks of our rulership. By public displays of piety by the rulers, the ruled will follow suit. The growing of piety amongst our people will strengthen our rule."
 work_is_worship:0 "Work as Worship"
 work_is_worship_desc:0 "Honest labour may itself be understood as service to God. By encouraging discipline, diligence and responsibility in everyday work, we can strengthen the productive foundations of our society."
 spread_the_word_of_god:0 "Spread the Word of God"
 spread_the_word_of_god_desc:0 "The message of our faith must reach beyond those who have merely strayed from its teachings. Missionaries willing to travel among distant peoples and unfamiliar cultures will allow us to bring the word of God to heathens throughout the world."
 proselytize_the_masses:0 "Proselytize the Masses"
 proselytize_the_masses_desc:0 "Conversion on a great scale requires more than individual preachers. By establishing permanent missionary institutions and providing them with reliable support, we can send more missionaries into the field while greatly reducing the cost of their work."
 deus_vult:0 "Deus Vult"
 deus_vult_desc:0 "Join the battle cry of the crusades, 'God wills it' and crush the infidels."

 muslim_ideas:0 "Allah's Ideas"
 muslim_ideas_bonus:0 "Allah's Favour"
 jizya_0:0 "Jizya"
 jizya_0_desc:0 "Non-Muslim communities living under our protection may retain their faith and institutions in return for fulfilling their obligations to the state. This arrangement provides a reliable source of revenue while allowing diverse religious communities to live peacefully within our realm."
 illuminate_the_unbelievers_0:0 "Illuminate the Unbelievers"
 illuminate_the_unbelievers_0_desc:0 "Those who have not yet embraced the faith must be given the opportunity to hear its teachings. By supporting missionaries and providing them with the resources needed for their work, we can spread our religion more effectively and at considerably lower cost."
 silk_road_trade_0:0 "Silk Road Trade"
 silk_road_trade_0_desc:0 "For centuries, merchants have carried goods between the markets of East and West through the lands of the Islamic world. By protecting these commercial routes and encouraging the merchants who travel them, we can strengthen our influence over regional trade and profit greatly from its exchange."
 imam_schools_0:0 "Schools of the Imams"
 imam_schools_0_desc:0 "Religious scholars and imams preserve the teachings of the faith and guide the spiritual life of our communities. Supporting institutions dedicated to their education provides us with more capable missionaries while strengthening the religious character of the state."
 gate_between_east_and_west_0:0 "Gate Between East and West"
 gate_between_east_and_west_0_desc:0 "Our position between the great markets of Europe, Africa and Asia allows us to act as an intermediary in the commerce of entire continents. Skilled merchants can direct this flow of goods through our markets and ensure that a greater share of its wealth passes through our hands."
 call_upon_the_believers_0:0 "Call Upon the Believers"
 call_upon_the_believers_0_desc:0 "Those united by faith share obligations not only to their communities but also to the defence of the realm. When called upon, the faithful will provide a deeper reserve of men willing to take up arms in its service."
 jihad_0:0 "Jihad"
 jihad_0_desc:0 "When the faith and its followers are threatened, the state may call upon the faithful to struggle in their defence. Such wars carry a powerful religious justification, allowing us to wage war against rulers of other faiths and demand more from victories over them."

 dharmic_ideas:0 "Dharmic Ideas"
 dharmic_ideas_bonus:0 "Prosperity Through Harmony"
 accept_small_religious_differences_0:0 "Religious Accommodation"
 accept_small_religious_differences_0_desc:0 "Differences in belief need not divide the realm. By recognising shared traditions and allowing communities room to follow their own practices, we can preserve religious unity while earning the goodwill of those around us."
 open_theological_debate_0:0 "Open Theological Debate"
 open_theological_debate_0_desc:0 "Faith is strengthened through discussion as much as through devotion. By encouraging scholars and preachers to openly debate matters of theology, we can train more missionaries and better equip them to spread our beliefs."
 teachings_of_buddha_0:0 "Philosophical Traditions"
 teachings_of_buddha_0_desc:0 "Generations of philosophers, theologians and scholars have reflected upon the nature of duty, knowledge and society. Drawing upon these intellectual traditions allows new ideas to be developed and adopted more efficiently."
 follow_the_gurus_0:0 "Learned Spiritual Advisors"
 follow_the_gurus_0_desc:0 "Respected teachers and spiritual authorities provide guidance not only in matters of faith but also in matters of state. By drawing advisers from among those who share our religious traditions, we can secure their services at a lower cost."
 meltingpot_of_cultures_0:0 "Melting Pot of Cultures"
 meltingpot_of_cultures_0_desc:0 "Our lands are home to peoples of many languages, customs and traditions. By allowing these communities to participate fully in the life of the state, we can recognise a wider range of cultures and integrate them more easily into our realm."
 the_land_provides_0:0 "The Land Provides"
 the_land_provides_0_desc:0 "The prosperity of the realm ultimately rests upon the land and the people who work it. By making effective use of local resources, labour and materials, we can reduce the cost of construction throughout our country."
 dharmashastra_0:0 "Dharmashastra"
 dharmashastra_0_desc:0 "A well-ordered society depends upon clear principles of law, duty and governance. By grounding our administration in established legal and moral traditions, we can govern a larger and more complex realm without overwhelming the institutions of the state."

 eastern_ideas:0 "Eastern Ideas"
 eastern_ideas_bonus:0 "Cultivated Realm"
 harmony_through_conversion_0:0 "Harmony Through Conversion"
 harmony_through_conversion_0_desc:0 "Religious differences within our wider spiritual tradition need not become permanent divisions. By bringing divergent teachings and practices into closer alignment with our own, we can restore harmony throughout the realm."
 defending_the_land_0:0 "Defending the Land"
 defending_the_land_0_desc:0 "The defence of the realm is a duty shared by ruler and subject alike. Fortifications prepared in advance and communities accustomed to supporting them will make every invasion far more difficult for our enemies."
 monuments_to_heaven_0:0 "Monuments to Heaven"
 monuments_to_heaven_0_desc:0 "Great temples, palaces and monuments embody the order and prosperity of the realm. By developing the expertise and institutions required for such works, we can complete these grand projects more quickly and at lower cost."
 early_urbanization_0:0 "Planned Urbanisation"
 early_urbanization_0_desc:0 "The growth of towns and cities is most effective when supported by deliberate planning. Coordinated infrastructure and administration allow us to expand our provinces and centralise their governance at considerably lower cost."
 divine_right_to_rule_0:0 "Sacred Authority"
 divine_right_to_rule_0_desc:0 "Whatever form our government may take, its authority must be recognised as legitimate by those it governs. By presenting political rule as part of a greater moral and social order, we can strengthen confidence in the state and preserve the prestige of its institutions."
 counter_western_religion_0:0 "Defence of the Faith"
 counter_western_religion_0_desc:0 "Foreign creeds and rival teachings may challenge the traditions upon which our society rests. A stronger missionary establishment will allow us to answer these influences and spread our own beliefs with greater effectiveness."
 legalism_0:0 "Legalist Administration"
 legalism_0_desc:0 "A realm governed through clear laws, disciplined officials and well-defined responsibilities can be administered far more efficiently. Strengthening these principles reduces the burden imposed by even our most developed states."

 decentralised_ideas:0 "Decentralised Ideas"
 decentralised_ideas_bonus:0 "A Network of Commerce"
 decentralised_ideas_0:0 "Chartered Investments"
 decentralised_ideas_0_desc:0 "Rather than concentrating commerce within a central bureaucracy, we encourage private and local interests to invest in trade companies. The resulting competition allows commercial enterprises to expand their influence at a reduced cost."
 decentralised_ideas_1:0 "Distributed Governance"
 decentralised_ideas_1_desc:0 "The administration of distant commercial territories need not be directed entirely from the capital. By granting greater autonomy to local institutions, we can govern our trade companies with fewer administrative resources."
 decentralised_ideas_2:0 "Provincial Commerce"
 decentralised_ideas_2_desc:0 "Local merchants and communities are encouraged to participate directly in international commerce. Their knowledge of regional markets allows our provinces to exert considerably greater influence over the trade passing through them."
 decentralised_ideas_3:0 "Loose Administration"
 decentralised_ideas_3_desc:0 "Territories need not be subjected to the same degree of administrative control as the heartland. By permitting local institutions to govern their own affairs, we can maintain distant territories without sacrificing their economic potential."
 decentralised_ideas_4:0 "Commercial Reach"
 decentralised_ideas_4_desc:0 "A decentralised commercial network can extend its influence far beyond the borders of the state. Improved trade connections and greater freedom for merchants allow us to steer commerce from increasingly distant markets.\n\nTrade Range: §G+250§!"
 decentralised_ideas_5:0 "Free Commerce"
 decentralised_ideas_5_desc:0 "Commerce flourishes when merchants are not burdened by excessive restrictions. By reducing the cost of mercantilist policies while expanding our influence over foreign trade, our merchants can compete in markets abroad."
 decentralised_ideas_6:0 "Trade Protectorates"
 decentralised_ideas_6_desc:0 "Commercial influence can be transformed into political leverage. Powerful trading partners may be brought into our sphere as trade protectorates, while our merchants gain greater means to demand access to foreign markets."
 can_establish_trade_protectorates_flag_tooltip:0 "Unlocks the ability to establish Trade Protectorates."
 decentralised_ideas_bonus:0 "A Network of Commerce"
 decentralised_ideas_bonus_desc:0 "Our decentralised institutions permit development to be concentrated efficiently while subjects on distant continents become easier to control."
 
 
 statecraft_ideas:0 "Statecraft Ideas"
 statecraft_ideas_bonus:0 "Efficient Administration"
 statecraft_ideas_0:0 "Administrative Stability"
 statecraft_ideas_0_desc:0 "A capable state begins with a stable administration. By establishing reliable procedures and institutions, we reduce the disruption and expense caused by maintaining stability."
 statecraft_ideas_1:0 "Educated Rulers"
 statecraft_ideas_1_desc:0 "The affairs of state demand rulers capable of understanding administration. By placing greater emphasis on statecraft and education, our monarchs can devote themselves more effectively to the business of government."
 statecraft_ideas_2:0 "Administrative Reform"
 statecraft_ideas_2_desc:0 "Our administrative institutions must continually adapt to the demands placed upon them. Reforming and expanding the state can be accomplished with fewer resources and less disruption."
 statecraft_ideas_3:0 "Institutional Reform"
 statecraft_ideas_3_desc:0 "Reform is not merely a matter of decrees from the throne. By establishing institutions capable of continuously improving the state, we can maintain a steady momentum of governmental reform."
 statecraft_ideas_4:0 "Absolute Authority"
 statecraft_ideas_4_desc:0 "A state cannot be efficiently governed when every decision is subject to competing interests. By strengthening the authority of the central government, we can exercise greater control over the affairs of the realm."
 statecraft_ideas_5:0 "Imperial Administration"
 statecraft_ideas_5_desc:0 "A great empire requires institutions capable of governing on an imperial scale. By strengthening our authority and prestige, we can better administer the diverse realms under our influence."
 statecraft_ideas_6:0 "Administrative Efficiency"
 statecraft_ideas_6_desc:0 "Centuries of experience have taught our officials how to accomplish more with less. A refined administrative apparatus allows the state to govern its territories with remarkable efficiency."
 
 
 fiscal_ideas:0 "Fiscal Ideas"
 fiscal_ideas_bonus:0 "Favourable Credit"
 fiscal_ideas_0:0 "Efficient Taxation"
 fiscal_ideas_0_desc:0 "A capable state must be able to reliably collect the revenues it is owed. Standardised taxation and a more effective fiscal administration will increase both the efficiency and consistency of our tax income."
 fiscal_ideas_1:0 "Sound Currency"
 fiscal_ideas_1_desc:0 "A stable currency is the foundation of a healthy treasury. Prudent monetary policy allows us to control inflation while ensuring that responsible repayment of public debt restores confidence in our finances.\n\n§YRepaying a Loan reduces Inflation.§!"
 fiscal_ideas_2:0 "War Finance"
 fiscal_ideas_2_desc:0 "Warfare places extraordinary demands upon the treasury and the population alike. A fiscal system prepared for war can raise extraordinary revenues without additional administrative cost and makes it easier to alleviate the exhaustion caused by prolonged conflict."
 fiscal_ideas_3:0 "Monetary Intervention"
 fiscal_ideas_3_desc:0 "Inflation cannot always be allowed to correct itself naturally. By empowering our financial institutions to intervene directly in the currency, we can restore monetary stability at a significantly reduced administrative cost."
 fiscal_ideas_4:0 "Resource Management"
 fiscal_ideas_4_desc:0 "The state's reserves must be managed with care. Better financial institutions reduce the cost of monetary intervention while allowing us to extract greater value from our mineral wealth."
 fiscal_ideas_5:0 "Military Budgeting"
 fiscal_ideas_5_desc:0 "A large standing army can drain even a wealthy treasury during a prolonged conflict. Permanent military budgets, predictable procurement and stricter oversight of expenditure allow us to maintain our forces more economically."
 fiscal_ideas_6:0 "Efficient Reinforcement"
 fiscal_ideas_6_desc:0 "Replacing men, equipment and supplies after battle represents a substantial part of the true cost of warfare. Centralised procurement and carefully managed military expenditure allow damaged regiments to be restored at a lower cost.\n\nUnlocks a decision to gain 5 years of income at the cost of a devastating 10 year modifier."
 
 
 internal_affair_ideas:0 "Internal Affair Ideas"
 internal_affair_ideas_bonus:0 "Unified Administration"
 internal_affair_ideas_0:0 "Balanced Estates"
 internal_affair_ideas_0_desc:0 "The estates are valuable partners in the governance of the realm, but none should become powerful enough to dictate state policy. A careful balance between their interests allows the government to retain greater authority."
 internal_affair_ideas_1:0 "Local Administration"
 internal_affair_ideas_1_desc:0 "Local officials should be given the means to resolve minor matters without constantly appealing to the central government. Efficient local administration reduces both autonomy and the burden placed upon the state."
 internal_affair_ideas_2:0 "National Prestige"
 internal_affair_ideas_2_desc:0 "The reputation of a state is not maintained by great deeds alone. Regular displays of competence and continuity ensure that our prestige endures rather than rapidly fading into obscurity."
 internal_affair_ideas_3:0 "Legitimised Rule"
 internal_affair_ideas_3_desc:0 "Every form of government requires a source of legitimacy. By strengthening the institutions and traditions that justify our rule, we can maintain the loyalty of our people regardless of the form our government takes."
 internal_affair_ideas_4:0 "Restoration of Order"
 internal_affair_ideas_4_desc:0 "Devastation leaves communities unable to recover and undermines the authority of the state. By restoring order and rebuilding affected regions, we can prevent the scars of war from becoming permanent."
 internal_affair_ideas_5:0 "Estate Settlement"
 internal_affair_ideas_5_desc:0 "Discontent among the population is often the result of disputes between local interests and the central government. By strengthening local administration and retaining the freedom to reform estate privileges, we can maintain order throughout the realm."
 internal_affair_ideas_6:0 "Patronage of Great Projects"
 internal_affair_ideas_6_desc:0 "Great projects require more than ambition; they require sustained administrative support. Improved institutions allow us to upgrade our greatest monuments and infrastructure with less expense and delay."
 
 court_ideas:0 "Court Ideas"
 court_ideas_bonus:0 "Full Court"
 long_echo:0 "Political Acumen"
 long_echo_desc:0 "A successful court attracts capable statesmen and cultivates those with a talent for politics. Whether authority passes through inheritance or election, this environment provides our rulers and candidates with the experience needed to excel in diplomacy and secure the confidence of those who choose their leaders."
 recognize_hierarchy:0 "Care of the Court"
 recognize_hierarchy_desc:0 "The health of the ruler is a matter of state. A well-organised court can provide the finest physicians, attendants and living conditions available, allowing those at its centre to remain in service to the realm for longer."
 welcoming_ceremonies:0 "Welcoming Ceremonies"
 welcoming_ceremonies_desc:0 "We shall entice incoming dignitaries with elaborate ceremonies and displays of power, wealth and prosperity."
 tranquil_coordination:0 "Continuity of Rule"
 tranquil_coordination_desc:0 "The institutions surrounding the ruler must be strong enough to endure changes at the very top. By cultivating respect for established authority and ensuring an orderly succession, the death of a ruler need not plunge the state into instability."
 palace_of_splendor:0 "Palace of Splendor"
 palace_of_splendor_desc:0 "No ruler may be adorned with glory and splendor without commanding a pristine and beautiful court."
 respected_authority:0 "Respected Authority"
 respected_authority_desc:1 "Our authority carries the weight of our ruler's grandeur. As such it brings with it certainty, prestige and an air of superiority.\nReduced Max Absolutism Impact from Privileges: §G-20.0%§!"
 court_embassies:0 "Absolute Court"
 court_embassies_desc:0 "As political life increasingly revolves around the ruler and their court, competing centres of authority are brought beneath the influence of the sovereign. The concentration of power at the heart of the state allows absolutism to reach heights that would otherwise be impossible."

 diplomatic_ideas:0 "Diplomatic Ideas"
 diplomatic_ideas_bonus:0 "Full Diplomacy"
 grand_banquets:0 "Grand Banquets"
 grand_banquets_desc:1 "Foreign dignitaries love the opportunity to partake in high society and the festivities that come with it. The grandeur of our society is known far and wide."
 foreign_embassies:0 "Foreign Embassies"
 foreign_embassies_desc:0 "Diplomacy is a delicate art of trying to balance several sides at the same time. If we maintain embassies in other countries reporting to us on a regular basis then we will have the information needed in order to ponder our options."
 cabinet:0 "Cabinet"
 cabinet_desc:0 "By establishing an executive council, we are able to assemble our most skilled diplomats."
 benign_diplomats:0 "Benign Diplomats"
 benign_diplomats_desc:0 "By being more careful in selecting and educating our diplomats, we will greatly increase our chance to exert our influence and establish a favorable position in other countries."
 experienced_diplomats:0 "Experienced Diplomats"
 experienced_diplomats_desc:0 "Sometimes it is simply enough for people to believe that we are powerful. We have worked hard on our diplomatic service to ensure that our word carries extra weight."
 flexible_negotiation:0 "Flexible Negotiation"
 flexible_negotiation_desc:0 "You can never quite know what can be gained at the peace table so we should enter the with all options open."
 diplomatic_corps:0 "Diplomatic Corps"
 diplomatic_corps_desc:1 "Through the establishment of a professional Diplomatic Corps we ensure that the lessons of senior diplomats are passed on to the younger generation."

 exploration_ideas:0 "Exploration Ideas"
 exploration_ideas_bonus:0 "Full Exploration Focus"
 quest_for_the_new_world:0 "Quest for the New World"
 quest_for_the_new_world_desc:0 "Allows us to join the number of nations set to explore the world outside of their borders or strive to be the first nation to circumnavigate the world by commencing a quest for the new world."
 colonial_ventures:0 "Colonial Ventures"
 colonial_ventures_desc:0 "Enables us to send more Colonists to uncharted lands."
 overseas_exploration:0 "Overseas Exploration"
 overseas_exploration_desc:0 "Setting up colonies in distant lands is pretty much a one-way trip. If strange new diseases don't get you, the amount of time it takes to sail back means you won't be coming home. If we remind people of the potential riches, we can encourage them to seek lands further afield."
 land_of_opportunity:0 "Land of Opportunity"
 land_of_opportunity_desc:0 "By portraying colonial lands and new virgin land where any man can make his fortune, possibly some women too, people will emigrate quicker to the colonies. Meaning the nation will have spent less money encouraging people to go there."
 factories:0 "Factories"
 factories_desc:0 "Factories were mostly fortified trading posts settled in offshore coastal areas. These provided safety for both the merchants and the local populace from hostile forces that would disturb our trade."
 free_colonies:0 "Free Colonies"
 free_colonies_desc:0 "Only so many people are willing to move abroad to expand our great colonial empire. However the promise of a plot of land to farm, in free hold, will encourage many more people to seek their fortune abroad. The nice thing about it is that there is plenty of land for everyone."
 global_empire:0 "Global Empire"
 global_empire_desc:0 "Our commitment to our colonial empire has changed the attitude of people to jobs in the colonial administration. No longer a place for freebooters who seek to maximize their fortune, instead it is seen as a career for the brightest and the best. This is reflected in our taxes."

 influence_ideas:0 "Influence Ideas"
 influence_ideas_bonus:0 "Full Influence"
 tribute_system:0 "Tribute System"
 tribute_system_desc:0 "Strengthen our income by establishing a formalized system of yearly tribute from our vassals."
 postal_service:0 "Postal Service"
 postal_service_desc:0 "With communications being what they are, it is difficult to ensure that our diplomatic dispatches arrive in a timely fashion. Creating a network of post offices and courier rest stops will make it easier for our voice to be heard in distant lands."
 integrated_elites:0 "Integrated Elites"
 integrated_elites_desc:0 "By bringing the ruling elite of our subject nations into our government we can smoothen the process of integrating their provinces significantly."
 buffer_states:0 "Buffer States"
 buffer_states_desc:0 "To avoid wars between us and a mighty rival, establishing a buffer state between us is not only mutually beneficial but imperative for the stability of the region."
 diplomatic_influence:0 "Diplomatic Influence"
 diplomatic_influence_desc:0 "By focusing on Diplomacy we can increase the power we wield on the diplomatic stage. This power can gain us many friends."
 marcher_lords:0 "Marcher Lords"
 marcher_lords_desc:0 "By granting considerable autonomy to vassals in border regions, these 'Marcher Lords' will be able to raise large military armies to support us in our wars."
 additional_loyalist_recruitment:0 "Cultivating Favors"
 additional_loyalist_recruitment_desc:0 "Influence is built through repeated cooperation and carefully maintained relationships. By supporting our partners and ensuring that our assistance is remembered, we can accumulate diplomatic favors far more quickly."

 maritime_ideas:0 "Maritime Ideas"
 maritime_ideas_bonus:0 "Full Maritime"
 merchant_traditions:0 "Merchant Traditions"
 merchant_traditions_desc:0 "Our nation has a long history of trading at sea with a network of merchants which reach far beyond the horizon. The excellence of our merchant marine and it's daring to sail seas others rather wouldn't is well known."
 merchant_marine:0 "Merchant Marine"
 merchant_marine_desc:0 "Let every merchant ship fly our merchant ensign with pride and know that our navy will always be there to protect them if needs must."
 grand_navy:0 "Grand Navy"
 grand_navy_desc:0 "Allows us to create one of the largest and most powerful fleets the world has ever seen."
 ships_penny:0 "Ship's Penny"
 ships_penny_desc:0 "Ships are expensive, what we need to do is to get other people to help pay for them. The Ship's penny is a perfect example of this."
 naval_fighting_instruction:0 "Naval Fighting Instruction"
 naval_fighting_instruction_desc:0 "Allows our naval veterans to devise new methods to improve our fleet's efficiency in blockades."
 sheltered_ports:0 "Maritime Support Network"
 sheltered_ports_desc:0 "Maintaining large numbers of sailors in active service requires a dependable network of ports, dockyards and coastal facilities. Better organisation of provisions, accommodation and naval administration reduces the continuing cost of sustaining our crews."
 sea_hawks:0 "Seahawks"
 sea_hawks_desc:0 "Allows us to focus heavily on military advancements and thereby increase our naval tradition."

 spy_ideas:0 "Espionage Ideas"
 spy_ideas_bonus:0 "Full Espionage"
 claim_fabrication:0 "Claim Fabrication"
 claim_fabrication_desc:0 "Claiming something as yours is easy, persuading everyone else that you have a valid claim is much harder. By spreading our diplomatic net wide, we can ensure that the people who matter know that this claim is ours."
 state_propaganda:0 "State Propaganda"
 state_propaganda_desc:0 "As with a man, a nation's reputation is everything, and the establishment of an official propaganda service will ensure our good name is not smeared by the lies of our enemies."
 efficient_spies:0 "Counterintelligence"
 efficient_spies_desc:0 "Foreign agents will inevitably attempt to infiltrate our government, armies and society. A professional counterintelligence service can identify suspicious activity, expose hostile networks and make our realm far more difficult to spy upon."
 vetting:0 "Political Subversion"
 vetting_desc:0 "A rival government can be attacked through more than open warfare. By studying the weaknesses of hostile regimes and preparing claims with greater precision, we can justify intervention against opposing forms of government without allowing the cost of further claims to spiral out of control."
 privateers:0 "Privateers"
 privateers_desc:0 "Waging war on enemy commerce rests on the apex of the first triad of victory. We will encourage crusty sea captains to strike at the enemy's trade."
 blackmailing:0 "Blackmailing"
 blackmailing_desc:0 "Even the most saint ally has his skeletons in the closet. Having a good relations with allies is always a good start, but to truly manipulate them to our bidding we should ensure that we always have a list of their secrets, and use these against them if they defy our good will."
 agent_training:0 "Infiltration Networks"
 agent_training_desc:0 "The best agents do more than gather information; they prepare the ground for our armies. Detailed knowledge of roads, garrisons and fortifications allows our forces to move more rapidly, conduct assaults more effectively and bring enemy strongholds down sooner."

 trade_ideas:0 "Trade Ideas"
 trade_ideas_bonus:0 "Full Trade Focus"
 shrewd_commerce_practise:0 "Shrewd Commerce Practice"
 shrewd_commerce_practise_desc:0 "Allows us to make use of more refined trading practices giving our merchants the upper hand over our competitors."
 free_trade:0 "Free Trade"
 free_trade_desc:0 "The current merchant families are seeking to ensure that trade privileges remain their exclusive preserve, but we are unwilling to do so and will allow the growth of the merchant class."
 merchant_adventures:0 "Merchant Adventures"
 merchant_adventures_desc:0 "Allows us to make use of the numerous traders lusting for fame and fortune, eager to offer their services for a chance to search and explore new trade routes."
 national_trade_policy:0 "National Trade Policy"
 national_trade_policy_desc:0 "By adopting a national trade policy, we can strengthen our commercial presence and increase the effectiveness of our trade."
 overseas_merchants:0 "Overseas Merchants"
 overseas_merchants_desc:0 "To grow trade we need to extend the rights of citizenship to people who live abroad, support our trade and are of the right social class."
 trade_manipulation:0 "Trade Manipulation"
 trade_manipulation_desc:0 "At those key choke points where trade could go one way or another, the ability to gain an edge there is key to the growth of our trade income."
 fast_negotiations:0 "Commercial Networks"
 fast_negotiations_desc:0 "Trade does not end at the borders of a single market. Well-established networks of merchants and caravan routes allow us to draw commerce overland and direct a greater share of international trade toward the markets that benefit us most."


 
 exploitation_ideas:0 "Exploitation Ideas"
 exploitation_ideas_bonus:0 "Imperial Commerce"
 exploitation_ideas_0:0 "Colonial Tariffs"
 exploitation_ideas_0_desc:0 "Our overseas possessions exist in part to enrich the homeland. A carefully organised tariff system allows us to extract a greater share of the wealth generated by our colonial territories."
 exploitation_ideas_1:0 "Colonial Revenues"
 exploitation_ideas_1_desc:0 "The wealth of the colonies must ultimately serve the interests of the mother country. By tightening our control over colonial revenues while reducing the cost of population transfers, we can extract greater value from our possessions."
 exploitation_ideas_2:0 "Colonial Subordination"
 exploitation_ideas_2_desc:0 "Colonial subjects must understand that their prosperity ultimately depends upon the protection of the mother country. By limiting their freedom to act independently, we can ensure that their economic development remains aligned with our interests.\nIn Colonial Subjects:\n  - Goods Produced Modifier: §G+20%§!"
 exploitation_ideas_3:0 "Commercial Monopoly"
 exploitation_ideas_3_desc:0 "Our merchants should dominate the markets supplied by our colonies. Stronger commercial networks allow us to direct a greater share of foreign trade towards our own markets."
 exploitation_ideas_4:0 "Colonial Investment"
 exploitation_ideas_4_desc:0 "The resources of the colonies cannot be exploited without adequate infrastructure. By directing investment towards productive and commercial construction, we can rapidly develop the economic foundations of our overseas possessions.\n\nUnlocks a decision to build with -20% cosnstruction cost in colonial subjects.\nUnlocks a decision to develop our colonial subjects."
 exploitation_ideas_5:0 "Plantation Economy"
 exploitation_ideas_5_desc:0 "Colonial territories possess vast quantities of land and natural resources. By directing their economies towards the production of valuable goods, we can increase the economic output of the entire empire.\n\nIn Colonial Subjects:\n  - Goods Produced: §G+0.20§!\n  - Land Forcelimit Modifier: §R-25%§!\n  - Naval Forcelimit Modifier: §R-15%§!"
 exploitation_ideas_6:0 "Colonial Tribute"
 exploitation_ideas_6_desc:0 "Our colonies owe their prosperity to the protection and investment of the mother country. Their wealth can therefore be redirected towards the treasury, while our control over colonial trade ensures that the profits remain within our sphere.\n\nIn Colonial Subjects:\n  - Provincial Trade Power Modifier: §G+25%§!\nUnlocks a decision seizing 6 months of income from a colony."
 exploitation_ideas_subject_0:0 "Colonial Subordination"
 exploitation_ideas_subject_1:0 "Directed Colonial Production"
 exploitation_ideas_subject_2:0 "Colonial Commercial Extraction"
 
 
 societal_ideas:0 "Social Ideas"
 societal_ideas_bonus:0 "Social Cohesion"
 societal_ideas_0:0 "Social Stability"
 societal_ideas_0_desc:0 "A stable society is the foundation upon which all other achievements rest. By addressing the causes of social unrest and maintaining public confidence, we can preserve stability at a lower cost."
 societal_ideas_1:0 "Cultural Integration"
 societal_ideas_1_desc:0 "A diverse realm need not be a divided one. By incorporating additional cultures into our society and reducing the cost of cultural integration, we can transform diversity into a source of strength."
 societal_ideas_2:0 "Diplomatic Restraint"
 societal_ideas_2_desc:0 "Expansion without consideration for its diplomatic consequences creates enemies faster than it creates prosperity. A more measured approach to international affairs reduces the resentment generated by our expansion."
 societal_ideas_3:0 "National Reconciliation"
 societal_ideas_3_desc:0 "Conquered peoples do not remain hostile forever. Through integration and the gradual establishment of a common national identity, the effects of nationalism can be overcome more quickly."
 societal_ideas_4:0 "Embrace of Progress"
 societal_ideas_4_desc:0 "New institutions and ideas spread rapidly through a society willing to adopt them. By encouraging intellectual exchange and reducing the cost of adopting new institutions, we can keep pace with the changing world."
 societal_ideas_5:0 "Social Order"
 societal_ideas_5_desc:0 "A cohesive society is one in which ordinary disputes do not threaten the authority of the state. Effective social institutions reduce unrest and prevent local grievances from becoming wider disturbances."
 societal_ideas_6:0 "Professional Administration"
 societal_ideas_6_desc:0 "The quality of government depends heavily upon the people who administer it. A larger pool of capable advisers and lower costs for employing them allow the state to benefit from expertise across a wider range of fields."
 
 
 grandeur_ideas:0 "Grandeur Ideas"
 grandeur_ideas_bonus:0 "Permanent Prestige"
 grandeur_ideas_0:0 "Splendour of the Court"
 grandeur_ideas_0_desc:0 "The magnificence of the state reflects the power of its ruler. Grand ceremonies, impressive institutions and lavish displays of wealth enhance the splendour of our realm."
 grandeur_ideas_1:0 "Glory in War"
 grandeur_ideas_1_desc:0 "Victory is one of the most visible measures of a nation's greatness. Our armies and fleets shall ensure that every triumph adds to the prestige of the realm."
 grandeur_ideas_2:0 "Imposing Power"
 grandeur_ideas_2_desc:0 "A nation renowned for its greatness is feared as much as it is respected. The reputation of our power makes our territorial demands more difficult for our enemies to resist."
 grandeur_ideas_3:0 "Dynastic Prestige"
 grandeur_ideas_3_desc:0 "The legitimacy of our institutions is inseparable from the grandeur of the state they represent. By cultivating the traditions and reputation of our government, we strengthen every form of authority upon which our realm rests."
 grandeur_ideas_4:0 "Monuments to Greatness"
 grandeur_ideas_4_desc:0 "Great rulers leave behind great works. By investing in the monuments and great projects that embody our power, we can construct and improve them with considerably less expense and delay."
 grandeur_ideas_5:0 "Distinguished Court"
 grandeur_ideas_5_desc:0 "A prestigious court attracts talented individuals from across the world. The fame of our realm allows us to employ distinguished advisers without bearing their full customary expense."
 grandeur_ideas_6:0 "Diplomatic Favour"
 grandeur_ideas_6_desc:0 "Prestige creates influence beyond the battlefield. The reputation of our realm gives our diplomats greater freedom to establish favourable agreements and pursue additional policies."
 grandeur_ideas_bonus_desc:0 "The accumulated prestige of our realm has become permanent. Our reputation alone is sufficient to command respect among foreign powers."
 
 
 nationalism_ideas:0 "Nationalism Ideas"
 nationalism_ideas_bonus:0 "National Identity"
 nationalism_ideas_0:0 "National Resilience"
 nationalism_ideas_0_desc:0 "A people united by a common national identity can endure hardships that would break a less cohesive society. The strength of our national spirit allows us to recover from the exhaustion of war more quickly."
 nationalism_ideas_1:0 "Cultural Unity"
 nationalism_ideas_1_desc:0 "The nation must possess a common identity if it is to remain united. Promoting our national culture and integrating territories inhabited by other cultures can be accomplished with less expense and in less time."
 nationalism_ideas_2:0 "National Mobilisation"
 nationalism_ideas_2_desc:0 "Every citizen has a role to play in defending the nation. A strong sense of national duty allows us to maintain our armed forces at a lower cost."
 nationalism_ideas_3:0 "Defence of the Homeland"
 nationalism_ideas_3_desc:0 "The people are most determined to defend the lands they consider their own. Provinces sharing our primary culture will therefore fight with considerably greater defensive resolve."
 nationalism_ideas_4:0 "National Martial Spirit"
 nationalism_ideas_4_desc:0 "The struggle to defend the nation produces soldiers who fight with exceptional determination. Armies operating within the heartland of our national culture gain a significant advantage in combat."
 nationalism_ideas_5:0 "Citizen Soldiers"
 nationalism_ideas_5_desc:0 "The population of our national heartland considers military service a duty owed to the nation. Our primary-culture provinces can consequently provide a far greater reserve of manpower."
 nationalism_ideas_6:0 "Patriotic Armies"
 nationalism_ideas_6_desc:0 "The national cause gives soldiers a reason to fight beyond simple obedience. A patriotic army possesses greater morale and is less easily broken on the battlefield."
 
 
 leadership_ideas:0 "Leadership Ideas"
 leadership_ideas_bonus:0 "Command Excellence"
 leadership_ideas_0:0 "Experienced Field Commanders"
 leadership_ideas_0_desc:0 "The movement of armies is too important to leave entirely to chance. Experienced commanders can manoeuvre their forces across the battlefield with greater speed and precision."
 leadership_ideas_1:0 "Naval Command"
 leadership_ideas_1_desc:0 "A fleet is only as effective as the officers directing it. Experienced admirals can bring their ships into decisive engagements and exploit the weaknesses of an opposing fleet."
 leadership_ideas_2:0 "Naval Gunnery"
 leadership_ideas_2_desc:0 "The decisive moment of a naval engagement often depends upon the accuracy and discipline of its officers. Better-trained commanders make more effective use of their ships' firepower."
 leadership_ideas_3:0 "Professional Officers"
 leadership_ideas_3_desc:0 "Competent officers are expensive to train and maintain, but their value to the state is beyond question. A professional officer corps allows us to recruit capable leaders at a lower cost."
 leadership_ideas_4:0 "Concentrated Fire"
 leadership_ideas_4_desc:0 "Coordinated fire support can determine the outcome of an engagement before the opposing force can react. Improved command procedures allow our artillery and naval guns to deliver devastating barrages at lower cost."
 leadership_ideas_5:0 "Fleet Manoeuvres"
 leadership_ideas_5_desc:0 "Naval warfare demands commanders capable of positioning their fleets under rapidly changing conditions. Skilled admirals allow our ships to manoeuvre more effectively during battle."
 leadership_ideas_6:0 "Offensive Command"
 leadership_ideas_6_desc:0 "An army's firepower is wasted without commanders capable of directing it. Officers trained in offensive warfare ensure that our forces make effective use of their weapons."
 leadership_ideas_bonus_desc:0 "Our command institutions have produced a generation of exceptional officers. Both armies and fleets benefit from commanders whose skill has been refined through experience."
 
 
 modernisation_ideas:0 "Modernisation Ideas"
 modernisation_ideas_bonus:0 "Professional Military"
 modernisation_ideas_0:0 "Modern Infantry"
 modernisation_ideas_0_desc:0 "The infantry remains the foundation of every army. Modern weapons, training and organisation allow our soldiers to perform considerably better on the battlefield."
 modernisation_ideas_1:0 "Artillery Reform"
 modernisation_ideas_1_desc:0 "Artillery has become indispensable to modern warfare. Standardised equipment and improved procurement allow us to field effective artillery formations at a lower cost."
 modernisation_ideas_2:0 "Rapid Reinforcement"
 modernisation_ideas_2_desc:0 "An army weakened by battle must be restored before it can return to the field. Improved logistics and training allow replacement troops and equipment to reach damaged units more quickly."
 modernisation_ideas_3:0 "Military Education"
 modernisation_ideas_3_desc:0 "The rapid development of military technology demands officers and soldiers capable of adapting to new methods. Investment in military education reduces the cost of adopting new technologies."
 modernisation_ideas_4:0 "Siege Artillery"
 modernisation_ideas_4_desc:0 "Heavy artillery has transformed the conduct of sieges. Properly equipped armies can bring additional artillery to bear against fortifications, making even well-defended positions vulnerable."
 modernisation_ideas_5:0 "Artillery Elite"
 modernisation_ideas_5_desc:0 "The most capable artillerymen of the realm are organised into elite formations. Their superior training increases the effectiveness of artillery deployed in the second line while expanding the number of elite guards available to the army."
 modernisation_ideas_6:0 "Modern Tactics"
 modernisation_ideas_6_desc:0 "The battlefield is constantly changing. By continually adapting our doctrine to new weapons and methods of warfare, our armies can maintain an advantage over less progressive enemies."
 
 
 militarism_ideas:0 "Militarism Ideas"
 militarism_ideas_bonus:0 "Militarised Society"
 militarism_ideas_0:0 "Martial Tradition"
 militarism_ideas_0_desc:0 "Military service has become an integral part of our national identity. A society accustomed to war produces soldiers more readily while preserving the traditions that sustain an effective army."
 militarism_ideas_1:0 "Storming Doctrine"
 militarism_ideas_1_desc:0 "Fortifications are obstacles, not guarantees of safety. Specialised assault tactics allow our armies to storm enemy positions with greater effectiveness while reducing the cost of such attacks."
 militarism_ideas_2:0 "Military Discipline"
 militarism_ideas_2_desc:0 "Drill is the foundation of military discipline. Better institutions allow our armies to maintain their training for longer while making it easier to bring inexperienced soldiers up to the required standard."
 militarism_ideas_3:0 "Military Tradition"
 militarism_ideas_3_desc:0 "The experience accumulated by generations of soldiers must not be allowed to disappear. Strong military institutions preserve our traditions and prevent them from fading with time."
 militarism_ideas_4:0 "Elite Infantry"
 militarism_ideas_4_desc:0 "The finest soldiers of the realm are gathered into elite infantry formations. Their presence strengthens the army while allowing the state to maintain a larger body of elite troops at lower cost."
 militarism_ideas_5:0 "Battlefield Excellence"
 militarism_ideas_5_desc:0 "Every battle provides an opportunity to improve. By rewarding experience and excellence on the battlefield, our armies accumulate military tradition while elite artillery formations can be integrated into the force."
 militarism_ideas_6:0 "Rapid Recovery"
 militarism_ideas_6_desc:0 "A militarised society can rapidly restore its armies after battle. Strong institutions accelerate the recovery of morale and allow depleted ranks to be replenished more quickly."
 militarism_ideas_bonus_desc:0 "Military service has become one of the defining institutions of our society. Our disciplined forces fight with greater effectiveness and cohesion."
 
 
 logistics_ideas:0 "Logistics Ideas"
 logistics_ideas_bonus:0 "Integrated Logistics"
 logistics_ideas_0:0 "Supply Organisation"
 logistics_ideas_0_desc:0 "An army can only fight as long as it can be supplied. A comprehensive supply system allows our forces to operate across a much wider area without exhausting local resources."
 logistics_ideas_1:0 "Rapid Marches"
 logistics_ideas_1_desc:0 "Efficient logistics allow armies to move without being slowed by their supplies. Better organised columns and improved transportation enable our forces to reach the battlefield more quickly."
 logistics_ideas_2:0 "Military Infrastructure"
 logistics_ideas_2_desc:0 "Armies require an extensive network of roads, depots and fortifications. Maintaining this infrastructure efficiently reduces the expense of both our forts and our standing armies."
 logistics_ideas_3:0 "Efficient Reinforcement"
 logistics_ideas_3_desc:0 "Replacing casualties is an expensive process when every soldier and piece of equipment must be transported individually. Centralised logistics allow damaged units to be reinforced at considerably lower cost."
 logistics_ideas_4:0 "Field Supply"
 logistics_ideas_4_desc:0 "Properly supplied armies are less dependent upon the resources immediately surrounding them. Improved provisioning reduces the losses caused by disease, hunger and difficult terrain."
 logistics_ideas_5:0 "Rapid Recruitment"
 logistics_ideas_5_desc:0 "A functioning military bureaucracy can recruit and equip new soldiers without unnecessary delays. Standardised procedures allow new regiments to be raised more efficiently."
 logistics_ideas_6:0 "Manpower Administration"
 logistics_ideas_6_desc:0 "The reserves of the nation must be managed as carefully as any other resource. Efficient recruitment and administration allow manpower reserves to recover more rapidly." 

 aet_ideas_navalMarines:0 "Naval Ideas Marine Modifier"
 
 aet_ideas_fiscalCountryRuined:0 "Fiscal Ruin"
 aet_ideas_fiscalCountryRuined_desc:0 "Years of reckless extraction and short-sighted financial policy have left the state in a precarious condition. The treasury is burdened with debt, the administration is weakened by corruption, and the population bears the consequences. The immediate gains may have been considerable, but the long-term price will be severe."
 
 aet_ideas_exploitationSubject_0:0 "Exploited Colonial Economy"
 aet_ideas_exploitationSubject_1:0 "Intensively Exploited Colonial Economy"
 aet_ideas_exploitationSubject_2:0 "Ruthlessly Exploited Colonial Economy"
 
 aet_ideas_exploitedSubject_0:0 "Colonial Exploitation"
 aet_ideas_exploitedSubject_1:0 "Severe Colonial Exploitation"
 aet_ideas_exploitedSubject_2:0 "Total Colonial Exploitation"
 
 aet_ideas_recentlyExploitedSubject:0 "Recently Exploited Colony"
 aet_ideas_recentlyExploitedSubject_desc:0 "Our recent extraction of wealth from a colonial subject has damaged our reputation and reduced the benefits we can expect from our other overseas possessions."
 
 aet_ideas_gullibleSubject:0 "Gullible Colonial Administration"
 aet_ideas_gullibleSubject_desc:0 "The government has backed down from confrontation with the mother country. Though this has temporarily restored order, our submission has damaged our standing and encouraged further exploitation."
 
 aet_ideas_historyOfExploitation:0 "History of Exploitation"
 aet_ideas_historyOfExploitation_desc:0 "Generations of extraction have left their mark upon this territory. The infrastructure and institutions established under colonial rule continue to provide economic benefits, but the legacy of exploitation remains a source of resentment and instability."
 
 aet_dominion_subjectModifier:0 "Dominion Administration"
 aet_dominion_subjectModifier_desc:0 "Our former colonial possessions retain considerable autonomy while benefiting from access to our markets and institutions."
 
 aet_dominion_overlordModifier:0 "Dominion Relations"
 aet_dominion_overlordModifier_desc:0 "Our former colony has been transformed into a Dominion. Although we have relinquished direct control, its continued prosperity remains beneficial to our state."
 
 aet_ideas_investingInTheColonies:0 "Investing in the Colonies"
 aet_ideas_investingInTheColonies_desc:0 ""

 aet_ideas_militaryAcademy_0:0 "Military Academy"
 aet_ideas_militaryAcademy_0_desc:0 "A professional military academy provides the state with a permanent institution for training and developing its officer corps."
 
 
 aet_ideas.1.t:0 "The Treasury at Breaking Point"
 aet_ideas.1.d:0 "Our attempts to extract every remaining resource from the state have provided us with a final opportunity to raise funds. The cost, however, has been deferred rather than eliminated. Our administration is exhausted, our finances are ruined, and the consequences of our actions will burden the country for years to come. We may take what remains, but there will be little left to sustain the state afterwards."
 aet_ideas.1.a:0 "Take everything we can."
 
 
 aet_ideas.2.t:0 "The Colonial Legacy"
 aet_ideas.2.d:0 "The territories inherited from our former colonial overlord contain infrastructure, institutions and developments built under the previous administration. Maintaining these investments would preserve their benefits, but doing so will require considerable expenditure from our treasury. Alternatively, we can dismantle what remains of the old system and recover the territories at no immediate cost."
 aet_ideas.2.a:0 "Preserve the colonial legacy, whatever the cost."
 aet_ideas.2.b:0 "Tear it down. We owe them nothing."
 
 
 aet_ideas.3.t:0 "Extracting Wealth from the Colonies"
 aet_ideas.3.desc:0 "Our colonial subjects possess considerable wealth that can be redirected towards the interests of the mother country. Two of our colonies have been selected as suitable targets for increased extraction. Such measures will enrich us immediately, but repeated exploitation will place an increasingly severe burden upon the colonies and may eventually provoke resistance."
 aet_ideas.3.a:0 "Extract from [aet_ideas_3_a_target.GetName]."
 aet_ideas.3.b:0 "Extract from [aet_ideas_3_b_target.GetName]."
 aet_ideas.3.c:0 "Choose another colony."
 aet_ideas.3.d:0 "Leave the colonies alone."
 
 
 aet_ideas.4.t:0 "The Price of Exploitation"
 aet_ideas.4.d:0 "The demands placed upon our colony have become intolerable. Our people have been pushed to the limits of what they will accept, and the continued extraction of wealth from our country has made the prospect of independence increasingly attractive. We must decide whether to prepare for an open struggle, build a wider movement among the colonies, or abandon our confrontation before it becomes a war."
 aet_ideas.4.a:0 "Prepare for war immediately."
 aet_ideas.4.b:0 "Bide our time and rally the other colonies."
 aet_ideas.4.c:0 "We must slow this down."
 
 
 aet_ideas.5.t:0 "Trouble in the Colonies"
 aet_ideas.5.d:0 "Reports from one of our colonial possessions suggest that unrest is growing. Our recent demands for wealth have generated resentment, and there are indications that the local government may be considering resistance. We must watch the situation carefully before discontent develops into an organised movement. (Keeping their liberty desire below 65 for a year will alleviate the concerns)"
 aet_ideas.5.a:0 "We will keep a close watch on them."
 
 
 aet_ideas.6.t:0 "A Demand for Autonomy"
 aet_ideas.6.d:0 "Our patience has run out. The continued exploitation of our country has demonstrated that our interests will never be given proper consideration while we remain under the authority of the mother country. We can either submit once again, accepting the humiliation and the consequences for our stability, or present our demands and prepare to defend them by force."
 aet_ideas.6.a:0 "Send our demands to the overlord."
 aet_ideas.6.b:0 "Back down."
 
 
 aet_ideas.7.t:0 "The Colonial Demand"
 aet_ideas.7.d:0 "Our colonial subject has formally demanded an end to its subordination. The situation has deteriorated to the point where continued exploitation may no longer be sustainable. We can accept their demands and reorganise the relationship as a Dominion, preserving much of our economic and diplomatic connection, or reject them and force the matter onto the battlefield."
 aet_ideas.7.a:0 "Give in to their demands."
 aet_ideas.7.b:0 "Let them try."
 
