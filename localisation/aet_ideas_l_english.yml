 aet_ideas_3_transfer_treasury_a:0 "[This.GetName] will transfer [This.aet_ideas_ducatsTransfer_a.GetValue] to us."
 aet_ideas_3_transfer_treasury_b:0 "[This.GetName] will transfer [This.aet_ideas_ducatsTransfer_b.GetValue] to us."

 aet_dominion:0 "Dominion"
 aet_dominion_title:0 "Dominion"
 aet_dominion_desc:0 "Dominions are partially self governing colonies."
 aet_dominion_long_desc:0 "Dominions are partially self governing colonies, who are autonomous communities within the realm, equal in status, in no way subordinate one to another in any aspect of their domestic or external affairs, though united by a common allegiance to the Crown.\nAs such a Dominion (sic!) is §Yfree in their diplomacy§!, and enjoys large boosts to their own income, benefiting themselves far more than comparable colonies."

 aet_native_rebels_name:0 "Native Rebels"
 aet_native_rebels_title:0 "Native Rebels"
 aet_native_rebels_desc:0 "These rebels wish to get rid of all settlers and revert all the provinces in our country to uncolonised provinces."
 aet_native_rebels_demand:0 "End Colonialism"
 aet_native_rebels_army:0 "Native Band"

 aet_ideas_exploitationDevelopSubject_title:0 "Develop Colony"
 aet_ideas_exploitationDevelopSubject_desc:0 "Allows us to invest 10 mana per province (for 3, 10 or 20 provinces) to apply decent buffs to colonial provinces, as well 1.75 development on average. This can cause native revolts."
 aet_ideas_exploitationDevelopSubject_tt:0 "Allows us to invest 10 mana per province (for 3, 10 or 20 provinces) to apply decent buffs to colonial provinces, as well as 1.75 development on average. This can cause native revolts (§RYoung colonies are very unlikely to survive this!§!). The exact modifier can be chosen in the next event. The fort modifier applies to all colonial forts."

 aet_ideas_exploitationExploitSubject_title:0 "Exploit Colony"
 aet_ideas_exploitationExploitSubject_desc:0 "Allows us to steal some money from our overseas dependencies."
 aet_ideas_exploitationExploitSubject_tt:0 "Allows us to choose a colony. We will take 6 months of income from that colony and give them a strong negative modifier. Doing so will increase liberty desire by 25 for 10 years each, as well as a burst of 25. Colonies above 65 liberty desire for more that one year may demand dominion status."

 aet_ideas_exploitationBuildInSubject_title:0 "Build in Colony"
 aet_ideas_exploitationBuildInSubject_desc:0 ""
 aet_ideas_exploitationBuildInSubject_tt:0 "Allows us to build Workshops, Counting Houses (Tech 22) or Manufactories (Tech 11) in our colonies. We can do so in either 3, 10 or 20 provinces at a cost modified by the local build cost, the colonies global build cost, our global build cost and a further 20% discount."

 aet_ideas_fiscalShortTermMoney_title:0 "Plunder the Reserve"
 aet_ideas_fiscalShortTermMoney_desc:0 "We will take whatever money we can find throughout our nation and use it to fund our efforts."
 aet_ideas_fiscalShortTermMoney_tt:0 " §RThis will cause a bankruptcy in no less than 5 years!§!\nThe following will happen when any of the following happens:\n  - Clicking the Decision \"Meet our demise\"\n  - Entering Bankruptcy\n  - After 5 years"

 aet_ideas_fiscalShortTermMoneyFireNow_title:0 "Meet our demise"
 aet_ideas_fiscalShortTermMoneyFireNow_desc:0 ""

