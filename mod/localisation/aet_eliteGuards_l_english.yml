 aet_eliteGuards.3.desc:0 "On possible Modifiers:\n - §YConstant Payment (damage dealt)§!\n   unique: pluto_morale\n   required: §YPlutocratic Ideas§! and (§YInfantry enabled§! or §YArtillery enabled§!)\n   §YMorale Damage Dealt§!: §G+10%§!\n - §YConstant Payment (damage received)§!\n   unique: pluto_morale\n   required: §YPlutocratic Ideas§! and (§YInfantry enabled§! or §YArtillery enabled§!)\n   §YMorale Damage Received§!: §G-10%§!\n - §YIntegration of Mercenary Bands§!\n   required: §YPlutocratic Ideas§! or §YMercenary Ideas§!\n   §YRegiment Manpower Usage§!: §G-20%§! and (§YInfantry enabled§! or §YArtillery enabled§!)\n Cost of these modifiers is num_of_modifiers * (1 + merc_cost_modifier) * (1 + merc_maintenance_modifier) * 0.5 §YLand Maintenance§!\n\n - §YOffensive Shock§!\n   unique: offensive_dealt\n   required: §YOffensive Ideas§! and §YInfantry enabled§!\n   §YShock Damage Dealt§!: §G+10%§!\n   §YReinforcement Cost§!: §R+33%§!\n   §YLand Maintenance§!: §R+25%§!\n - §YOffensive Fire§!\n   unique: offensive_dealt\n   required: §YOffensive Ideas§! and §YInfantry enabled§!\n   §YFire Damage Dealt§!: §G+10%§!\n   §YReinforcement Cost§!: §R+33%§!\n   §YLand Maintenance§!: §R+25%§!   \n - §YOffensive Assault§!\n   required: §YOffensive Ideas§! and §YInfantry enabled§!\n   §YAssault Fort Ability§!: §G+50%§!\n   §YReinforcement Cost§!: §R+5%§!\n   \n - §YQuantity Focus§!\n   required: §YInfantry enabled§! and full_idea_group = quantity_ideas \n   On §YCountry§!:\n    aet_eliteGuards_buffMultiplier = -0.10\n    aet_eliteGuards_forceLimit = 0.075"
 aet_eliteGuards.3.a:0 "On Actions"
 aet_eliteGuards.3.b:0 "On Force Limit"
 aet_eliteGuards.3.c:0 "Cav Modifiers"
 aet_eliteGuards.3.d:0 "Close"
 aet_eliteGuards.4.t:0 "Elite Guards Long Description (Cav Modifiers)"
 aet_eliteGuards.4.desc:0 " - §YHeavy Cavalry Focus§!\n   unique: cavalry_focus\n   required: §YCavalry enabled§!\n   shock_damage = 0.35\n	 morale_damage = 0.35\n	 fire_damage = -0.05\n	 morale_damage_received = -0.2\n	 shock_damage_received = -0.05\n	 fire_damage_received = -0.05\n	 cavalry_cost = 2\n	 land_maintenance_modifier = 1\n	 recover_army_morale_speed = -0.35\n	 reinforce_speed = -0.75\n\n   On §YCountry§!:\n    aet_eliteGuards_forceLimit = -0.075\n	  nobles_influence_modifier = 0.1\n\n - §YLight Cavalry Focus§!\n   unique: cavalry_focus\n   required: §YCavalry enabled§!\n	 shock_damage = 0.1\n	 cavalry_flanking = 0.5\n	 cavalry_cost = -0.05\n\n   On §YCountry§!:\n	  cav_to_inf_ratio = 0.05\n	  cavalry_power = 0.05\n	  cavalry_cost = -0.1   \n\n - §YIntegrate the Cossacks into our Elite Cavalry§!\n   required: §YLight Cavalry Focus§! and §Yhas_estate = estate_cossacks§!\n	 shock_damage = 0.025\n	 cavalry_cost = -0.05\n\n   On §YCountry§!:\n	  cav_to_inf_ratio = 0.025\n	  cavalry_power = 0.025\n	  cavalry_cost = -0.05\n    allowed_cossack_fraction = -1\n    aet_eliteGuards_forceLimit = 0.10   \n\n - §YHorse Archer Focus§!\n   unique: cavalry_focus\n   required: §YCavalry enabled§! and (is horde, east slavic, hungarian, nomad or teuton)\n	 cavalry_fire = 0.5\n	 fire_damage = 0.10\n	 cavalry_flanking = 1   \n\n   On §YCountry§!:\n    movement_speed = 0.1\n\n - §YNomadic Horse Archery Focus§!\n   required: §YCavalry enabled§! and full_idea_group = horde_gov_ideas \n	 cavalry_fire = 1.5 \n	 fire_damage = 0.15\n	 cavalry_cost = -0.15     \n\n   On §YCountry§!:\n    movement_speed = 0.1    "
 aet_eliteGuards.4.a:0 "On Actions"
