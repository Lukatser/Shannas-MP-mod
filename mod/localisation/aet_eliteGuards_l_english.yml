 aet_eliteGuards_shortDesc:0 "§YElite Guards§! are a special unit that can take the form of Infantry, Cavalry or Artillery. Their base modifiers are not all too strong, but they can be improved greatly by having different ideas / government reforms. They do not feature a hard cap on force limit, but they do have a soft cap §YElite Guards Forcelimit§!. It is advisable to stay within [0.75; 1.25] of the §YElite Guards Forcelimit§! to avoid penalties."
 aet_eliteGuards_longDesc:0 "§YElite Guards§! are a special unit that can take the form of Infantry, Cavalry or Artillery.\n\nOn Actions:\n Modifying how §YElite Guards§! work via decisions costs §YAction Points§!. Up to §Y5§! action points can be stored. You regain one point per year. Currently you have stored [ROOT.aet_eliteGuards_actions_bank.GetValue] action points.\n If you take an action while you are below 0 stored action points, it will cost §Y20 * 2^n§! mil mana where n is the number of actions you have taken while below 0 stored action points. This cost is capped at §Y600§! mil mana.\n\nOn their forcelimit: \n The forcelimit of §YElite Guards§! is not hard capped, but it is soft capped. The de facto force limit can be changed via the decisions §YIncrease Elite Guards Forcelimit§! and §YDecrease Elite Guards Forcelimit§!. Doing so costs a §Yhalf action§!. \n Depending on de facto force limit compared to §YElite Guards Forcelimit§! the following modifiers will be applied:\n  - (-inf; 0.5] on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §G+40%§!\n    §YInfantry Cost§!: §G-35%§!\n    §YCavalry Cost§!: §G-35%§!\n    §YArtillery Cost§!: §G-35%§!\n    §YLand Maintenance§!: §G-35%§!\n\n  - (0.5; 0.70] on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §+30%§!\n    §YInfantry Cost§!: §G-35%§!\n    §YCavalry Cost§!: §G-35%§!\n    §YArtillery Cost§!: §G-35%§!\n    §YLand Maintenance§!: §G-35%§!\n\n  - (0.70; 0.80] on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §+10%§!\n\n  - [1.25; 1.35) on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §R-10%§!\n    §YInfantry Cost§!: §R+25%§!\n    §YCavalry Cost§!: §R+25%§!\n    §YArtillery Cost§!: §R+25%§!\n    §YLand Maintenance§!: §R+25%§!\n\n  - [1.35; 1.5) on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §R-30%§!\n    §YInfantry Cost§!: §+50%§!\n    §YCavalry Cost§!: §+50%§!\n    §YArtillery Cost§!: §+50%§!\n    §YLand Maintenance§!: §+50%§!\n  - [1.35; 1.5) on §YCountry§!:\n    §YLand Forcelimit§!: §R-5%§!\n\n  - [1.5; 1.75) on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §R-40%§!\n    §YInfantry Cost§!: §+50%§!\n    §YCavalry Cost§!: §+50%§!\n    §YArtillery Cost§!: §+50%§!\n    §YLand Maintenance§!: §+50%§!\n  - [1.5; 1.75) on §YCountry§!:\n    §YLand Forcelimit§!: §R-10%§!\n\n  - [1.75; 2) on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §R-50%§!\n    §YInfantry Cost§!: §+75%§!\n    §YCavalry Cost§!: §+75%§!\n    §YArtillery Cost§!: §+75%§!\n    §YLand Maintenance§!: §+75%§!\n  - [1.75; 2) on §YCountry§!:\n    §YLand Forcelimit§!: §R-10%§!\n    §YGoverning Capacity§!: §R-25%§!\n    §YAll Power Cost§!: §R+5%§!\n    \n  - [2; +inf) on §YElite Guards§!:\n    §YElite Guards Buff Multiplier§!: §R-50%§!\n    §YInfantry Cost§!: §+100%§!\n    §YCavalry Cost§!: §+100%§!\n    §YArtillery Cost§!: §+100%§!\n    §YLand Maintenance§!: §+100%§!\n  - [2; +inf) on §YCountry§!:\n    §YLand Forcelimit§!: §R-10%§!\n    §YGoverning Capacity§!: §R-25%§!\n    §YAll Power Cost§!: §R+5%§!\n    §YYearly Corruption§!: §R+1§!\n    §YMin Autonomy§!: §R+20§!\n\nOn possible Modifiers:\n - §YConstant Payment (damage dealt)§!\n   unique: pluto_morale\n   required: §YPlutocratic Ideas§! and (§YInfantry enabled§! or §YArtillery enabled§!)\n   §YMorale Damage Dealt§!: §G+10%§!\n - §YConstant Payment (damage received)§!\n   unique: pluto_morale\n   required: §YPlutocratic Ideas§! and (§YInfantry enabled§! or §YArtillery enabled§!)\n   §YMorale Damage Received§!: §G-10%§!\n - §YIntegration of Mercenary Bands§!\n   required: §YPlutocratic Ideas§! or §YMercenary Ideas§!\n   §YRegiment Manpower Usage§!: §G-20%§! and (§YInfantry enabled§! or §YArtillery enabled§!)\n Cost of these modifiers is num_of_modifiers * (1 + merc_cost_modifier) * (1 + merc_maintenance_modifier) * 0.5 §YLand Maintenance§!\n\n - §YOffensive Shock§!\n   unique: offensive_dealt\n   required: §YOffensive Ideas§! and §YInfantry enabled§!\n   §YShock Damage Dealt§!: §G+10%§!\n   §YReinforcement Cost§!: §R+33%§!\n   §YLand Maintenance§!: §R+25%§!\n - §YOffensive Fire§!\n   unique: offensive_dealt\n   required: §YOffensive Ideas§! and §YInfantry enabled§!\n   §YFire Damage Dealt§!: §G+10%§!\n   §YReinforcement Cost§!: §R+33%§!\n   §YLand Maintenance§!: §R+25%§!   \n - §YOffensive Assault§!\n   required: §YOffensive Ideas§! and §YInfantry enabled§!\n   §YAssault Fort Ability§!: §G+50%§!\n   §YReinforcement Cost§!: §R+5%§!\n\n - §YHeavy Cavalry Focus§!\n   unique: cavalry_focus\n   required: §YCavalry enabled§!\n   shock_damage = 0.35\n	 morale_damage = 0.35\n	 fire_damage = -0.05\n	 morale_damage_received = -0.2\n	 shock_damage_received = -0.05\n	 fire_damage_received = -0.05\n	 cavalry_cost = 2\n	 land_maintenance_modifier = 1\n	 recover_army_morale_speed = -0.35\n	 reinforce_speed = -0.75\n\n   On §YCountry§!:\n    aet_eliteGuards_forceLimit = -0.075\n	  nobles_influence_modifier = 0.1\n\n - §YLight Cavalry Focus§!\n   unique: cavalry_focus\n   required: §YCavalry enabled§!\n	 shock_damage = 0.1\n	 cavalry_flanking = 0.5\n	 cavalry_cost = -0.05\n\n   On §YCountry§!:\n	  cav_to_inf_ratio = 0.05\n	  cavalry_power = 0.05\n	  cavalry_cost = -0.1   \n\n - §YIntegrate the Cossacks into our Elite Cavalry§!\n   required: §YLight Cavalry Focus§! and §Yhas_estate = estate_cossacks§!\n	 shock_damage = 0.025\n	 cavalry_cost = -0.05\n\n   On §YCountry§!:\n	  cav_to_inf_ratio = 0.025\n	  cavalry_power = 0.025\n	  cavalry_cost = -0.05\n    allowed_cossack_fraction = -1\n    aet_eliteGuards_forceLimit = 0.10   \n\n - §YHorse Archer Focus§!\n   unique: cavalry_focus\n   required: §YCavalry enabled§! and (is horde, east slavic, hungarian, nomad or teuton)\n	 cavalry_fire = 0.5\n	 fire_damage = 0.10\n	 cavalry_flanking = 1   \n\n   On §YCountry§!:\n    movement_speed = 0.1\n\n - §YNomadic Horse Archery Focus§!\n   required: §YCavalry enabled§! and full_idea_group = horde_gov_ideas \n	 cavalry_fire = 1.5 \n	 fire_damage = 0.15\n	 cavalry_cost = -0.15     \n\n   On §YCountry§!:\n    movement_speed = 0.1    \n\n - §YQuantity Focus§!\n   required: §YInfantry enabled§! and full_idea_group = quantity_ideas \n   On §YCountry§!:\n    aet_eliteGuards_buffMultiplier = -0.10\n    aet_eliteGuards_forceLimit = 0.075"
